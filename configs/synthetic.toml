[common]
num-samples = 20000
ground-set-size = 2000
max-set-size = 200
feature-dimension = 3
num-epochs = 400
early-stopping-patience = 30

[SubmodInt-L1]
model = "submod-int"
num-layers = 1
no-m-1 = true
interaction-fn = "b"
transform-hidden-dims = [32]
modular-hidden-dims = [32]
fac-loc = { lr = 1e-3, lr-decay-factor = 0.7, lr-patience = 5,  batch-size = 64,  weight-decay = 1e-4 }
g-cut   = { lr = 1e-3, lr-decay-factor = 0.7, lr-patience = 10, batch-size = 128, weight-decay = 1e-4 }
int-2-1 = { lr = 1e-3, lr-decay-factor = 0.7, lr-patience = 10, batch-size = 128, weight-decay = 1e-4 }
log     = { lr = 5e-4, lr-decay-factor = 0.7, lr-patience = 5,  batch-size = 64,  weight-decay = 1e-4 }
log-det = { lr = 1e-3, lr-decay-factor = 0.7, lr-patience = 10, batch-size = 128, weight-decay = 1e-4 }
sqrt    = { lr = 2e-3, lr-decay-factor = 0.7, lr-patience = 10, batch-size = 128, weight-decay = 1e-4 }

